name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      # lfs: brand-assets.test.ts reads the real bytes of the LFS-tracked
      # logo PNG; a pointer file instead of the asset fails the suite.
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  node-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # seo-worker и directus: "test": "node --test" (автодискавери), зависимостей нет
      - run: npm test
        working-directory: seo-worker
      - run: npm test
        working-directory: directus
      # deploy/ и scripts/ — тесты вне package.json, запускаем напрямую из корня
      - run: node --test deploy/ scripts/
