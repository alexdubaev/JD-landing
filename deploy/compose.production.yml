name: jd-landing

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - /opt/jd-landing/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend

  directus:
    image: directus/directus:12.1.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:8055:8055"
    depends_on:
      database:
        condition: service_healthy
    env_file:
      - /opt/jd-landing/.env
    environment:
      DB_CLIENT: pg
      DB_HOST: database
      DB_PORT: 5432
      PUBLIC_URL: https://cms.deere-shop.ru
      WEBSOCKETS_ENABLED: "true"
      ADMIN_RATE_LIMITER_ENABLED: "true"
      RATE_LIMITER_ENABLED: "true"
      PASSWORD_POLICY: "/.{12,}/"
      REFRESH_TOKEN_TTL: "1d"
      REFRESH_TOKEN_COOKIE_SECURE: "true"
      REFRESH_TOKEN_COOKIE_SAME_SITE: "lax"
      TELEMETRY: "false"
      MAX_PAYLOAD_SIZE: 50mb
    volumes:
      - directus_uploads:/directus/uploads
      - directus_extensions:/directus/extensions
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8055/server/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
    networks:
      - backend
      - web

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: https://deere-shop.ru
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    depends_on:
      directus:
        condition: service_healthy
    env_file:
      - /opt/jd-landing/.env
    environment:
      DIRECTUS_URL: http://directus:8055
      NEXT_PUBLIC_SITE_URL: https://deere-shop.ru
      # Manager lead notifications (SMTP). All optional; when unset,
      # notifications are silently disabled and leads are still stored.
      # IndexNow: accelerates Yandex/Bing re-crawl after CMS edits. Optional;
      # when unset, IndexNow pings are skipped. The key must also be served at
      # https://deere-shop.ru/<INDEXNOW_KEY>.txt (place the file in frontend/public/).
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks:
      - web

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      directus:
        condition: service_healthy
      frontend:
        condition: service_healthy
    env_file:
      - /opt/jd-landing/.env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web

networks:
  backend:
    internal: true
  web:

volumes:
  postgres_data:
  directus_uploads:
  directus_extensions:
  caddy_data:
  caddy_config:
