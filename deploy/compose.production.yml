name: jd-landing

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend

  directus:
    image: directus/directus:12.1.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:8055:8055"
    depends_on:
      database:
        condition: service_healthy
    environment:
      SECRET: ${DIRECTUS_SECRET}
      DB_CLIENT: pg
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}
      PUBLIC_URL: https://cms.deere-shop.ru
      WEBSOCKETS_ENABLED: "true"
      TELEMETRY: "false"
      MAX_PAYLOAD_SIZE: 50mb
      # Studio Live Preview starts at the CMS bridge, then loads only the trusted
      # public site in that same iframe.
      CONTENT_SECURITY_POLICY_DIRECTIVES__FRAME_SRC: "'self' https://deere-shop.ru"
      NEXT_REVALIDATE_URL: http://frontend:3000/api/revalidate
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      # Directus server signs short-lived Studio preview forms. The secret is
      # never exposed to a browser and matches the frontend verifier.
      PREVIEW_SECRET: ${PREVIEW_SECRET:-}
      NEXT_PREVIEW_CONSUME_URL: ${NEXT_PREVIEW_CONSUME_URL:-https://deere-shop.ru/api/preview/consume}
    volumes:
      - directus_uploads:/directus/uploads
      - directus_extensions:/directus/extensions
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8055/server/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
    networks:
      - backend
      - web

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: https://deere-shop.ru
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    depends_on:
      directus:
        condition: service_healthy
    environment:
      DIRECTUS_URL: http://directus:8055
      DIRECTUS_TOKEN: ${DIRECTUS_TOKEN}
      DIRECTUS_PUBLIC_FOLDER_ID: ${DIRECTUS_PUBLIC_FOLDER_ID}
      NEXT_PUBLIC_SITE_URL: https://deere-shop.ru
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      # Secure Live Preview (Task 16/R12). PREVIEW_SECRET signs the preview
      # cookie and authenticates /api/preview; DIRECTUS_PREVIEW_TOKEN is the
      # server-only Directus static token for versioned reads. Both optional;
      # when unset, preview endpoints refuse to work but the site is unaffected.
      PREVIEW_SECRET: ${PREVIEW_SECRET:-}
      DIRECTUS_PREVIEW_TOKEN: ${DIRECTUS_PREVIEW_TOKEN:-}
      # Manager lead notifications (SMTP). All optional; when unset,
      # notifications are silently disabled and leads are still stored.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      NOTIFY_EMAIL_TO: ${NOTIFY_EMAIL_TO:-}
      # IndexNow: accelerates Yandex/Bing re-crawl after CMS edits. Optional;
      # when unset, IndexNow pings are skipped. The key must also be served at
      # https://deere-shop.ru/<INDEXNOW_KEY>.txt (place the file in frontend/public/).
      INDEXNOW_KEY: ${INDEXNOW_KEY:-}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks:
      - web

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      directus:
        condition: service_healthy
      frontend:
        condition: service_healthy
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      DIRECTUS_CMS_AUTH_USER: ${DIRECTUS_CMS_AUTH_USER:-}
      DIRECTUS_CMS_AUTH_HASH: ${DIRECTUS_CMS_AUTH_HASH:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web

networks:
  backend:
    internal: true
  web:

volumes:
  postgres_data:
  directus_uploads:
  directus_extensions:
  caddy_data:
  caddy_config:
